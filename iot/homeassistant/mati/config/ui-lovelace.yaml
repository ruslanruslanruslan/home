title: Home
views:

  - title: Public
    path: public
    panel: true
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.gate_front
            live_provider: go2rtc
          - camera_entity: camera.room01
            live_provider: go2rtc
          - camera_entity: camera.room05
            live_provider: go2rtc
          - camera_entity: camera.room08
            live_provider: go2rtc
          - camera_entity: camera.justin
            live_provider: go2rtc
          - camera_entity: camera.backyard
            live_provider: go2rtc
          - camera_entity: camera.stairway
            live_provider: go2rtc
        live:
          display:
            mode: grid
        view:
          default: live
          camera_select: live
        menu:
          style: hover
          buttons:
            cameras:
              enabled: false
            recordings:
              enabled: true
            clips:
              enabled: true
            snapshots:
              enabled: true
            timeline:
              enabled: true
        media_viewer:
          controls:
            next_previous:
              style: thumbnails
            thumbnails:
              mode: below
              size: 100
              show_details: true
              show_download_control: false
              show_favorite_control: false
              show_timeline_control: true
            timeline:
              mode: below
              style: ribbon
              show_recordings: true
              window_seconds: 3600
        timeline:
          style: ribbon
          show_recordings: true
          window_seconds: 7200
          controls:
            thumbnails:
              mode: right
              size: 75
              show_details: true
        status_bar:
          style: none

  - title: Private
    path: private
    panel: true
    cards:
      - type: custom:advanced-camera-card
        cameras:
          - camera_entity: camera.livingroom
            live_provider: go2rtc
          - camera_entity: camera.gate_back
            live_provider: go2rtc
          - camera_entity: camera.madam
            live_provider: go2rtc
        live:
          display:
            mode: grid
        view:
          default: live
          camera_select: live
        menu:
          style: hover
          buttons:
            cameras:
              enabled: false
            recordings:
              enabled: true
            clips:
              enabled: true
            snapshots:
              enabled: true
            timeline:
              enabled: true
        media_viewer:
          controls:
            next_previous:
              style: thumbnails
            thumbnails:
              mode: below
              size: 100
              show_details: true
              show_download_control: false
              show_favorite_control: false
              show_timeline_control: true
            timeline:
              mode: below
              style: ribbon
              show_recordings: true
              window_seconds: 3600
        timeline:
          style: ribbon
          show_recordings: true
          window_seconds: 7200
          controls:
            thumbnails:
              mode: right
              size: 75
              show_details: true
        status_bar:
          style: none

  - title: Internet
    type: sections
    path: internet
    sections:

      - type: grid
        cards:
          - type: heading
            heading: Monitoring
          - type: iframe
            name: Speedtest
            url: http://192.168.4.201:8081/
            aspect_ratio: 100%
            allow: fullscreen
          - type: iframe
            name: Smokeping
            url: http://192.168.4.201:8082/smokeping/?target=_charts
            aspect_ratio: 100%
            allow: fullscreen

      - type: grid
        cards:
          - type: heading
            heading: Network
          - type: entities
            title: Internet
            show_header_toggle: false
            entities:
              - entity: sensor.mikrotik_ether1_rx
                type: custom:multiple-entity-row
                name: PLDT Usage
                show_state: false
                entities:
                  - entity: sensor.mikrotik_ether1_rx
                    name: RX
                  - entity: sensor.mikrotik_ether1_tx
                    name: TX
              - entity: sensor.mikrotik_hex_cpu_load
                type: custom:multiple-entity-row
                name: Router Load
                entities:
                  - entity: sensor.mikrotik_hex_memory_usage
                    name: RAM
